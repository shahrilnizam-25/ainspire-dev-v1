services:
  - type: web
    name: ainspire-api
    runtime: node
    buildCommand: npm install -g pnpm && pnpm install && cd artifacts/api-server && node build.mjs
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: TM_LLM_API_KEY
        sync: false
